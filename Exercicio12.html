<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 12</title>
</head>
<body>

<script>

function verificarNumero(numero) {
    if (numero % 2 == 0) {
        return "PAR";
    } else {
        return "ÍMPAR";
    }
}

let numero = parseInt(prompt("Digite um número inteiro:"));

let resultado = verificarNumero(numero);

alert(resultado);

document.write("<h2>Resultado</h2>");
document.write("<p>Número: " + numero + "</p>");
document.write("<h3>" + resultado + "</h3>");

</script>

</body>
</html>
