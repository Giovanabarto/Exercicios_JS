<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offcanvas End</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            padding: 40px;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        h1{
            text-align: center;
            margin-bottom: 30px;
        }

        .container{
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Exemplo de Offcanvas End</h1>

    <div class="container">
        <button class="btn btn-success"
                type="button"
                data-bs-toggle="offcanvas"
                data-bs-target="#menuDireita">
            ☰ Abrir Menu
        </button>
    </div>

    <!-- Offcanvas End -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="menuDireita">

        <div class="offcanvas-header">
            <h5 class="offcanvas-title">Menu Lateral Direito</h5>

            <button type="button"
                    class="btn-close"
                    data-bs-dismiss="offcanvas">
            </button>
        </div>

        <div class="offcanvas-body">

            <ul class="list-group">
                <li class="list-group-item">🏠 Início</li>
                <li class="list-group-item">👤 Perfil</li>
                <li class="list-group-item">📩 Mensagens</li>
                <li class="list-group-item">⚙️ Configurações</li>
                <li class="list-group-item">🚪 Sair</li>
            </ul>

            <br>

            <p>
                Este menu utiliza a classe
                <strong>offcanvas-end</strong>,
                que faz o painel abrir pela direita da tela.
            </p>

        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
