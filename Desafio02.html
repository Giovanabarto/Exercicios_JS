<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 01</title>
</head>
<body>

    <script>
        // Entrada de dados
        let nome = prompt("Digite o nome do vendedor:");
        let salario = parseFloat(prompt("Digite o salário fixo:"));
        let vendas = parseFloat(prompt("Digite o valor total das vendas:"));

        // Processamento
        let comissao = vendas * 0.15;
        let salarioFinal = salario + comissao;

        // Saída
        alert("Olá " + nome + ", seu salário desse mês será de R$ " + salarioFinal.toFixed(2) + "!");

        // Exibe também na página
        document.write("<h2>Resultado</h2>");
        document.write("<p><strong>Nome:</strong> " + nome + "</p>");
        document.write("<p><strong>Salário Fixo:</strong> R$ " + salario.toFixed(2) + "</p>");
        document.write("<p><strong>Vendas:</strong> R$ " + vendas.toFixed(2) + "</p>");
        document.write("<p><strong>Comissão (15%):</strong> R$ " + comissao.toFixed(2) + "</p>");
        document.write("<p><strong>Salário Final:</strong> R$ " + salarioFinal.toFixed(2) + "</p>");
    </script>

</body>
</html>
