<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 23</title>
</head>

<body>

    <label>Entrada:</label>
    <input type="text" id="entrada" placeholder="Digite o Carácter">

    <hr>

    <label>Letra:</label>
    <input type="text" id="letra" readonly>

    <label>Número:</label>
    <input type="text" id="numero" readonly>

    <script>

        let entrada = document.getElementById("entrada");
        let letra = document.getElementById("letra");
        let numero = document.getElementById("numero");

        entrada.addEventListener("input", function () {

            let caractere = entrada.value;

            // Verifica se é número
            if (!isNaN(caractere) && caractere !== "") {

                numero.value = caractere;
                letra.value = "";

            } 
            // Verifica se é letra
            else {

                letra.value = caractere;
                numero.value = "";

            }

        });

    </script>

</body>

</html>
