<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício Extra - Bhaskara</title>
</head>
<body>

<script>

let a = parseFloat(prompt("Digite o valor de A:"));
let b = parseFloat(prompt("Digite o valor de B:"));
let c = parseFloat(prompt("Digite o valor de C:"));

let delta = (b * b) - (4 * a * c);

if (a == 0 || delta < 0) {
    alert("Impossivel calcular");
    document.write("<h2>Impossivel calcular</h2>");
} else {
    let r1 = (-b + Math.sqrt(delta)) / (2 * a);
    let r2 = (-b - Math.sqrt(delta)) / (2 * a);

    alert("R1 = " + r1.toFixed(5) + "\nR2 = " + r2.toFixed(5));

    document.write("<h2>Resultado</h2>");
    document.write("<p>R1 = " + r1.toFixed(5) + "</p>");
    document.write("<p>R2 = " + r2.toFixed(5) + "</p>");
}

</script>

</body>
</html>
