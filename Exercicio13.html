<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 13</title>
</head>
<body>

<script>

function converterMaiusculo(nome) {
    return nome.toUpperCase();
}

let nome = prompt("Digite seu nome em letras minúsculas:");

let nomeMaiusculo = converterMaiusculo(nome);

alert(nomeMaiusculo);

document.write("<h2>Resultado</h2>");
document.write("<p>Nome digitado: " + nome + "</p>");
document.write("<h3>Nome em maiúsculas: " + nomeMaiusculo + "</h3>");

</script>

</body>
</html>
