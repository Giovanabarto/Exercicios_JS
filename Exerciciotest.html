<!DOCTYPE html>
 <html lang="en"> 
    <head>
         <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Document</title> 
        </head> 
        <body>
             <title>IF e ELSE</title>
              <script> var idade = prompt('Qual é sua idade'); if(idade >= 0 && idade < 15){ document.write('CRIANÇA'); }else if(idade >= 15 && idade < 30){ document.write('JOVEM'); }else if(idade >= 30 && idade < 60){ document.write('ADULTO'); }else{ document.write('IDOSO'); } </script>
             </body>
              </html>
